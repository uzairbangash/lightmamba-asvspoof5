{
  "database_path": "data/",
  "model_path": "./exp_result/WavLM_LightTransformer_ASV5_ep60_bs8/weights/best_ast.pth",

  "batch_size": 8,
  "num_epochs": 20,
  "grad_accum_steps": 4,

  "cudnn_deterministic_toggle": "True",
  "cudnn_benchmark_toggle": "False",

  "early_stop": "True",
  "early_stop_patience": 8,
  "early_stop_min_delta": 0.0005,

  "use_gam": "False",
  "use_amp": "True",
  "grad_clip_norm": 1.0,

  "backbone_lr": 0.000007,
  "fusion_lr": 0.00005,
  "head_lr": 0.0001,
  "layerwise_lr_decay": 0.9,
  "unfreeze_epoch": 6,
  "unfreeze_strategy": "gradual",
  "unfreeze_layers_per_epoch": 1,

  "balanced_sampling": "True",
  "balanced_sampling_power": 0.5,

  "use_ema": "True",
  "ema_decay": 0.9995,
  "ema_update_interval": 4,
  "eval_use_ema": "True",

  "swa_start_epoch": 999,

  "prefer_track1_tsv": "True",
  "num_workers": 6,

  "save_tsne": "True",
  "tsne_max_samples": 0,
  "save_epoch_scores": "True",
  "save_epoch_predictions": "True",
  "save_epoch_metric_json": "True",
  "save_epoch_figures": "True",
  "save_embedding_archives": "True",
  "embedding_archive_max_samples": 3000,
  "save_group_metric_json": "True",
  "save_calibrated_metrics": "True",
  "enable_calibration": "True",
  "track_eval_during_training": "False",
  "allow_eval_tracking_leak": "False",
  "run_final_eval_after_training": "True",

  "eval_num_segments": 9,
  "eval_segment_overlap": 0.75,
  "eval_score_pooling": "mean_max_attention",

  "binary_loss": "focal",
  "ce_weight_spoof": 1.0,
  "ce_weight_bonafide": 3.0,
  "focal_gamma": 2.0,
  "focal_alpha": -1.0,

  "model_config": {
    "architecture": "AST",
    "pretrained_name": "microsoft/wavlm-large",
    "sample_rate": 16000,
    "crop_seconds": 4.0,

    "trim_silence": "True",
    "silence_threshold": 0.003,
    "silence_hangover": 640,
    "use_augment": "True",

    "freeze_feature_extractor": "True",
    "freeze_layers": 18,

    "lt_layers": 4,
    "lt_heads": 4,
    "dropout": 0.2,
    "backend_time_mask_prob": 0.35,
    "backend_time_mask_width": 24,
    "backend_channel_mask_prob": 0.25,
    "backend_channel_mask_width": 20,

    "num_attack_classes": 9,
    "use_attack_head": "False",

    "pos_weight": 1.0,

    "w_bce": 1.0,
    "w_supcon": 0.05,
    "w_aam": 0.0,
    "w_gate_entropy": 0.00005,
    "w_l2_anchor": 0.0001,

    "aam_margin": 0.2,
    "aam_scale": 30,
    "supcon_temperature": 0.07
  },

  "optim_config": {
    "optimizer": "adamw",
    "amsgrad": "False",
    "base_lr": 0.00001,
    "lr_min": 0.0000005,
    "betas": [0.9, 0.98],
    "weight_decay": 0.01,
    "scheduler": "cosine"
  }
}
